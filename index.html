<!DOCTYPE html>
<html lang="sv">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

        <h1>Weather API</h1>

    <script type="module" src="script/scripts.js"></script>
