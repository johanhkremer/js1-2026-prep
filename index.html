<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>DOM fort.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/index.css">
</head>

<body class="container min-vh-100 d-flex flex-column">
    <header>
        <h1>Todo app</h1>
    </header>
    <main class="flex-grow-1">
        <form id="todoForm">
            <div class="mb-3">
                <label for="todoInput" class="form-label">Todo input</label>
                <input type="text" class="form-control" id="todoInput" aria-describedby="todoHelp">
                <div id="todoHelp" class="form-text">Input your todo in the text area</div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <section>
            <ul class="list-group" id="todoList">
            </ul>
        </section>
    </main>

    <footer class="m-auto p-3">JS1 - DOM manipulation</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script/index.js"></script>
</body>

</html>
